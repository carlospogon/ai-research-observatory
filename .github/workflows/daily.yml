name: Daily scientific discovery
on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover arXiv candidates
        run: python scripts/discover.py
      - name: Commit only if candidates changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh arXiv research candidates"
            git push
          fi
